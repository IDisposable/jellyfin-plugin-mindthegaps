changelog: >
  10.11.7.2 (beta) - Follow-up to 10.11.7.1's Gaps Report overhaul. The domain tabs (Movies/Shows/Music/
  Books) move to the very top of the report, above the filters, since picking one is the first thing you
  do on the page. A row's Watch/Info/Actions popovers now open on hover as well as click, close a moment
  after the pointer leaves, and only one is open at a time; they (and a title's hover-revealed overview)
  no longer get clipped when the row is not near the top of a long list, and close if you scroll the page
  while one is open. The A-Z letter bar shows each letter on its own, with its gap count moved into the
  hover text instead of cluttering the label. The report and settings pages now show an error message
  instead of spinning forever or failing silently if a load or save fails, and switching domains or
  patterns quickly no longer risks a slower, superseded request overwriting what you switched to.
