changelog: >
  10.11.8.2 (beta) - Streaming-service icons on a report row now show the service's logo for every title, not
  only ones looked up recently: the logos are filled in from TMDB's provider list on the next scan or "where
  to watch" pass, and a service TMDB has no logo for shows its initial. A service that TMDB lists as several
  providers, such as a "with Ads" tier or a reseller's channel, now shows as one icon and has one entry in
  the provider filter instead of several. In the Web UI, the detail dialog's close button is centered and its
  View on TMDB, View on IMDb, and Watch trailer links match the other buttons; the "More like this you don't
  have" row on a movie or series page lines up with the row above it; and the home Discover row's title
  lines up with the other sections. The Resolve button in a row's expanded detail lines up with the buttons
  beside it. The scan log now says how long each source took, which shows which one is holding up a slow scan.
