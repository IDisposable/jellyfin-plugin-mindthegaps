changelog: >
  10.11.10.2 (beta) - A new scheduled task, Prune gaps from deleted items, takes library items that have
  been deleted out of the report: a gap they were the only source of is removed, and one with other
  sources moves to the next. It has no default schedule, so run it from the scheduled tasks page or give
  it one; it waits for a running scan, and a second scan now waits for the first. Recommendation groups
  link to the owned title they came from. Books get an OpenLibrary id field and albums and artists a
  Discogs id field in the metadata editor, with a link on the item's page; a separate OpenLibrary or
  Discogs plugin takes over automatically when installed. Links are built from each title's ids when the
  report loads rather than stored with it, so a TheTVDB, JustWatch or Trakt plugin installed later adds
  its links everywhere, and a Trakt link appears when the Trakt sources are on. The report takes far less
  memory and disk: on a library with 83,000 gaps it went from about 1.6 GB to about 200 MB in memory and
  from 245 MB to 131 MB on disk, loads in about half the time, and is written much less often during a
  scan or a where-to-watch lookup. Existing reports convert on first load. A report saved by this version
  cannot be read by an earlier one, so going back to an earlier version shows an empty report until its
  next scan.
