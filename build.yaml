changelog: >
  10.11.5.4 - The Discover tab is laid out the way the rest of the report already was. The lists you keep come
  first (your TMDB, Trakt, MDBList and JustWatch watchlists, your IMDb lists, your Discogs wantlist, your
  OpenLibrary shelf, your TheTVDB favorites), then the lists you pointed the plugin at, then everything your
  own library suggested, each under its own heading with the individual lists inside it. Until now they were
  all one flat run of headings, so a list you deliberately keep sat next to a film that happened to recommend
  something, with nothing to tell the two apart. A list that was read and holds nothing you are missing now
  says so under its own heading instead of not appearing at all, and one that could not be read this scan says
  that instead, so neither reads as a list you never switched on. The Markdown export is grouped the same way,
  so an exported Discover list and the tab on screen agree.
