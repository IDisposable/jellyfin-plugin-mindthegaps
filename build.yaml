changelog: >
  10.11.8.5 (beta) - The report and the Web UI can now load their posters, covers, and streaming-service
  logos through your server instead of each browser fetching them from TMDB and the other providers. It is
  off by default: turn on "Keep the pages' images on this server" in the new Images section of settings.
  The server fetches each image once, from a fixed list of provider hosts only, keeps it under its cache
  folder, and serves it from there. Anything it cannot serve at once, such as an image it has not fetched
  yet, a provider that has stopped answering it, or a full cache, sends the browser on to the provider, so
  an image still shows. A "Trim the image cache" scheduled task, run at startup and daily, keeps the cache
  to the size you set (500 MB by default). On an author's page, the "More by this author you don't have"
  row now lines up with the section above it.
