changelog: >
  10.11.7.3 (beta) - Fixes the Gaps Report's row popovers (Watch/Info/Actions), which 10.11.7.2 shipped
  broken: clicking or hovering a row did nothing. Opening one now toggles it directly instead of relying
  on the browser's native click handling, and the title's hover-revealed overview no longer depends on a
  CSS feature some browsers don't support. Only one popover is open at a time, same as before.
