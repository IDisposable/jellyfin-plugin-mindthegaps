changelog: >
  10.11.10.1 (beta) - Want to watch gains three options, all off by default and all requiring the
  arrived-titles playlist (contributed by David Rappo, @rappo, in PR 21): the home row can lead
  with the titles already on your playlist, a title comes off the playlist once it is watched (a series
  once every episode is played), and a movie or series page gets a bookmark button among its own. Plugin
  rows are reachable with a TV remote's D-pad, and a focused card grows like the stock ones. Not
  interested, off by default, lets each user hide a title from their own Web UI pages without hiding it
  for anyone else, with a list to show hidden titles again. A user with a parental rating limit now sees
  the Web UI sections narrowed to the titles that limit allows, rather than none of them. The home
  Discover row, the Want to watch row, and the item page rows each have a placement setting: off, top,
  bottom, or after one of Jellyfin's own sections; existing settings carry over. The Gaps Report's
  toolbar is grouped by what each control acts on, every section, letter bucket, and group header has a
  select-all that works before the group is opened, a line above the list says how many rows the search
  and Hide filters are hiding, and Add to TODO is now Add to watchlist. A long section can be narrowed to
  two letters, the report is usable at phone width, and scan progress follows how long each stage took
  last time. The settings page has collapsible sections, a search, a back-to-top button, and better
  screen reader support. Amazon search links leave out the year, which made most of them miss, and the
  Fulfillment queue no longer shows a second JustWatch search.
