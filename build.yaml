changelog: >
  10.11.7.5 (beta) - Follow-up polish to 10.11.7.4's row popovers. The title's hover-revealed detail
  moved to below the Watch/Info/Actions icons, drops the repeated title, and now shows where to watch
  alongside the overview. It stays open when you move the pointer into it instead of closing the
  moment you leave the title, and clicking a title pins it open until you click that title or another
  row's again, so clicking elsewhere on the page (or outside the browser) no longer dismisses it.
  Popover and detail buttons/links are sized and centered consistently with the rest of the dashboard.
