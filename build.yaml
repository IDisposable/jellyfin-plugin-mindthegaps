changelog: >
  10.11.8.3 (beta) - Each user now has their own want-to-watch list, kept in the plugin's data folder and
  removed when the user is deleted. The first administrator to open the old ToDO list after this update
  takes over the old shared TODO list, and an administrator can view and manage everyone's want-to-watch list.
  The Web UI gains a Want to watch feature, opt-in with its own toggle in settings: every card carries a
  bookmark that adds the title to their own list, the detail dialog has a matching button, and the home
  page can show a Want to watch row of what you have listed and do not yet own.
  Artist pages now list the albums you do not have and book pages list more by the same author, each with
  its own detail dialog and an administrator's add to TODO.
  The detail dialog links to the title's own JustWatch page when the scan found one, otherwise to the
  JustWatch search in your region.
  On the report, a row's streaming icons link to the title's TMDB watch page, and only the title is
  clickable, not the empty parts of the row.
  A user with a parental rating limit is shown none of the Web UI sections, and a page shows its section
  only to a user who can see that item.
  The home Discover row now shows recommendations made from titles you own and titles from lists that are
  public by nature (TMDB lists, Trakt lists, and TMDB's own feeds), it will not show recommendations from
  a watchlist, wantlist, favorites, or a personal list.
  A TMDB list that cannot be read, such as a private one, no longer stops the other lists from being
  scanned.
  Filling in a large library's series content is now done in batches.
