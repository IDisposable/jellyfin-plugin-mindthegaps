changelog: >
  10.11.11.0 - Want to watch gains three options, all off by default and all requiring the arrived-titles
  playlist (contributed by David Rappo, @rappo, in PR 21): the home row can lead with the titles already on
  your playlist, a title comes off the playlist once it is watched (a series once every episode is played),
  and a movie or series page gets a bookmark button among its own. Plugin rows are reachable with a TV
  remote's D-pad. Not interested, off by default, lets each user hide a title from their own Web UI pages
  without hiding it for anyone else. A user with a parental rating limit sees the Web UI sections narrowed
  to the titles that limit allows, rather than none of them. The home Discover row, the Want to watch row,
  and the item page rows each have a placement setting; existing settings carry over. The Gaps Report's
  toolbar is grouped by what each control acts on, every header has a select-all, a line above the list
  says how many rows the filters hide, and Add to TODO is now Add to watchlist. The report is usable at
  phone width, and the settings page has collapsible sections, a search, and better screen reader
  support. A new scheduled task, Prune gaps from deleted items, takes deleted library items out of the
  report: a gap they were the only source of is removed, and one with other sources moves to the next. It
  has no default schedule; it waits for a running scan, and a second scan waits for the first.
  Recommendation groups link to the owned title they came from. Books get an OpenLibrary id field and
  albums and artists a Discogs id field in the metadata editor, with a link on the item's page; a
  dedicated OpenLibrary or Discogs plugin takes over when installed. Links are built from each title's ids
  when the report loads, so a link plugin installed later applies everywhere. The report takes far less
  memory and disk (on a library with 83,000 gaps, about 1.6 GB down to 200 MB in memory and 245 MB down to
  131 MB on disk), loads in about half the time, and is written far less often during scans and
  where-to-watch lookups. Existing reports convert on first load; a report saved by this version cannot be
  read by an earlier one, so going back shows an empty report until its next scan.
