changelog: >
  10.11.7.4 (beta) - Fixes the Gaps Report's row popovers (Watch/Info/Actions) and hover-revealed
  overview for real this time: the browser's own page wrapper uses a CSS feature that changes where a
  floating overlay renders, which put every popover somewhere other than where it was calculated to be,
  invisibly. They are plain expanding content in the row now, with no floating position to get wrong.
  Only one popover is open at a time, same as before.
