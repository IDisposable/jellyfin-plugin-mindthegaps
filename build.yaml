changelog: >
  10.11.11.1 (beta) - A new opt-in Discover source lists artists similar to the ones you own, from
  ListenBrainz: keyless, for owned artists with a MusicBrainz id, a slice of them each scan. IMDb
  watchlists and IMDb lists are separate Discover sections, and a section shows only for the kind you
  configured. A watchlist entered by its "ur" user id lost its gaps on every scan; it now keeps them. A
  watchlist never shows on the home Discover row, and a public IMDb list can. Each MDBList list has a
  Public toggle, and only a list marked Public shows on the home Discover row. A person can carry an
  OpenLibrary author key in the metadata editor, which the book bibliography uses before it searches by
  name, so a wrong namesake can be corrected. A Trakt filmography credit with no IMDb id still gets a
  Trakt link, and the Discogs wantlist and OpenLibrary shelf groups link to the list's page. A TMDB list
  is read across all its pages. Loading a large report and finishing a scan no longer call every link
  provider for every gap, so both are faster. A verify, re-check or where-to-watch pass during a scan no
  longer writes over the scan's checkpoint, and a write that fails is tried again on the next one. The zip
  no longer includes Newtonsoft.Json.dll.
