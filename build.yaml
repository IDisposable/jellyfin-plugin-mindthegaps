changelog: >
  10.11.5.3 - Diagnose no longer reports a mix-up over a title that is not out yet. An announced movie that
  shares its name with one you own (the announced "Highlander" against the 1986 one on your shelf) was read
  as a misidentified item, because an announced title usually carries no date at all, so the year test that
  tells a remake from the original had nothing to compare. It now says what is actually true: the one you own
  is an earlier, different release and nothing needs fixing. The owned item stays listed so you can see for
  yourself why it was not the match, and a shared external id still outranks the title, since that is
  evidence of identity rather than a coincidence of names. A scan, and clearing off what you have filled in,
  now read less of your library. Every query the plugin makes asks the server for only the parts it uses, so
  an item no longer arrives carrying its images and every user's playstate alongside it. The snapshot of what
  you own that a scan holds for its whole run keeps only what it compares against rather than the library
  items themselves, so a long scan no longer holds your library in memory while it waits on the providers.
  Clearing a whole heading, or verifying a long TODO list, now checks your library once for the batch instead
  of once per row, which is the difference between a moment and a wait on a large library. Nothing changes
  about what is found or what is cleared.
