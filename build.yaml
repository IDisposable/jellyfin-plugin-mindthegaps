changelog: >
  10.11.8.1 (beta) - An experimental, opt-in Web UI adds Mind the Gaps sections to Jellyfin's own pages:
  a person's page lists what they made that you do not own, a movie or series page suggests titles like
  it that you are missing, and the home page gets a Discover row of the recommendations your scans found.
  A master switch and one toggle per surface in settings control them, all off by default. Click a card
  for a detail dialog with TMDB's synopsis, genres, runtime, rating, and a trailer link, then send it to
  Radarr or Sonarr with the quality profile you pick, or add it to your TODO list; the dialog and the card
  grids can be driven from a keyboard or a TV remote. The Gaps Report loads faster: it fetches one tab at
  a time as slim rows, fetches a row's overview, links, and where-to-watch details only when you open it,
  and revalidates what it already holds instead of downloading it again, and both dashboard pages load
  their script and stylesheet as separately cached files. A row shows up to two streaming-service icons
  on its collapsed line, following your provider and monetization filters; logos appear after the next
  where-to-watch lookup, and until then a service shows its initial. Gaps left behind by a source you
  have since removed or turned off, such as a dropped keyword or a disabled watchlist, are now pruned on
  every scan, and a Prune stale gaps button under Maintenance does it right away. The saved report is now
  stored as one file per domain, so a Verify or a Send rewrites only the domain it touched; an existing
  report is converted automatically the next time it is saved.
