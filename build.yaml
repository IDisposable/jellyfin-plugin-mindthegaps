changelog: >
  10.11.7.1 (beta) -  Four new TMDB feeds, Top Rated, Popular, Upcoming, and Now Playing, can be turned
  on individually under Discover. Jellyfin 12.0 is now a supported target alongside 10.11, each release
  building and shipping its own ABI-matched package. The Gaps Report page flips its navigation so
  Movies, Shows, Music, and Books are the primary tabs, each badged with its own gap count, with Set
  completion, Creator works, and Discover as a dropdown scoped to whichever domain is active; only the
  active domain's data stays loaded, so switching domains no longer accumulates memory the way holding
  every domain at once did. A Compact view toggle switches the list to a denser layout, and every row,
  compact or not, now opens its watch links, provider links, and actions from three icon popovers instead
  of a long row of buttons; hovering or focusing a title reveals its overview without leaving the list.
  The toolbar is split into a filter row and an action row. The settings page is reorganized into one
  collapsible section per provider (TMDB, Trakt, MDBList, Discogs, OpenLibrary, TheTVDB, IMDb, JustWatch),
  each badged on or off, plus a search box that opens whichever section a match lands in. MDBList entries
  now carry a poster and description like every other source. A creator's page can be trimmed further
  with a minimum TMDB vote count for a movie credit and a minimum episode count for a TV credit, both
  separate from the scan-wide filmography floor since TV credits carry no vote count. The TODO list
  shows an image and release date per entry. Sending a whole-series gap to Sonarr from a filmography,
  recommendation, or favorites entry now sends the series' own title rather than the name of whatever
  surfaced it, and a rejected Radarr, Sonarr, or Jellyseerr request shows the service's validation message
  instead of a raw response body.
