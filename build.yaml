changelog: >
  10.11.7.6 (beta) - More Gaps Report polish. Hovering a title no longer reveals its detail (it was
  too easy to dismiss by accident moving toward it); click the title instead, same as before, and a
  collapsed title's browser tooltip now shows its overview with no click at all. In the normal
  (non-compact) view, expanding a title's detail now folds in the Where to watch, Information, and
  Actions content as one set of buttons that tile across instead of stacking one per line, and hides
  the row's icons only while that detail is open, showing them the rest of the time exactly like
  Compact view does. Detail and popover buttons no longer stretch to the full width of the row.
