changelog: >
  10.11.5.1 - Anything you have filled in can be cleared off the report without a rescan. A refresh
  control on every row and every heading (a domain, a set kind, a group, a season) checks your library right
  now and drops what you already hold, and a "Clear what I have" button does the whole filtered tab at once.
  This is local and immediate: no provider is contacted, and it works in every domain. Anything still missing
  then offers to re-check the sources it belongs to with their providers, which also picks up whatever has
  been added to a collection, discography, or bibliography since the last scan; that pass runs in the
  background with progress and saves each set as it finishes. A title you have acquired leaves every tab it
  appeared on at once, so one film clears out of its collection, the studio set that wanted it, its
  director's filmography, and any list that suggested it. The TODO list checks the same way, with a Verify
  all that ticks everything you now hold and un-ticks anything that has left the library, and both Markdown
  exports check before writing, so an exported list is what you still need rather than what the last scan
  believed. Titles with no release date at all are treated as not yet out: TheMovieDb and the episode
  providers date anything that has actually been released, so an undated movie, series, or episode from them
  is announced but unscheduled, is badged Announced, and hides under "Hide upcoming" along with announced
  seasons that were never produced. Music and books are exempt, since a sparse Discogs, MusicBrainz, or
  OpenLibrary entry for a decades-old release often carries no date and is a genuine gap. Whether something
  counts as upcoming is now worked out afresh on every scan, so a title stops being upcoming once its release
  date passes. Record label sets sort into their proper place instead of last, and book subject sets group
  under Subjects rather than a heading reading Other.
