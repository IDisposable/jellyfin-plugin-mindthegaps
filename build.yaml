- "Newtonsoft.Json.dll"
changelog: >
  10.11.9.3 (beta) - The report's multi-select bar gained bulk Acquire/Request and a bulk Resolve, alongside
  Mint and Add to TODO, so a checked batch of rows can be sent to acquisitions providers or dismissed with
  one shared note in one action. An administrator can now manage another user's want-to-watch list, and a
  title that arrives (however it was fetched) can automatically move into a real, per-user Jellyfin playlist
  so it shows up to watch in every client, not just this plugin's pages. Amazon and web-search links for
  books and music now fold in the author or artist everywhere they appear (the report, the Web UI, and the
  Fulfillment queue), since a title alone is a weak search query when many works share a name. TMDB lists,
  Trakt lists, and OpenLibrary subjects are configured with the same chip-picker/search boxes the other
  curated sources already use, replacing raw comma-separated id fields.
