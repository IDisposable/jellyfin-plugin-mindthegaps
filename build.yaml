changelog: >
  10.11.5.2 - The lists you already keep elsewhere become gaps. Turn on any of them in the settings and
  each arrives as its own group on the Discover tab: your IMDb watchlist or any public IMDb list, your Trakt
  watchlist, your JustWatch watchlist and likes, your MDBList watchlist, your Discogs wantlist, your
  OpenLibrary "Want to Read", and your favorite series on TheTVDB. An IMDb list of people is read differently,
  as a filmography to fill in, which is what lets you follow a director or an actor you own nothing by yet.
  Most of these need nothing new beyond what you have already configured; the IMDb and OpenLibrary reads are
  keyless and only need the list to be public, TheTVDB favorites need a subscriber PIN, and JustWatch needs a
  session token pasted in because it publishes no account API. Personal lists are re-read every ten minutes
  rather than held for the twelve hours a catalog lookup gets, since a watchlist is edited between scans, and
  they are capped far above any real list rather than truncated, so nothing you curated goes unseen. Your
  TMDB watchlist, and your favorites if you want them, are read the same way once you connect your TMDB
  account: two clicks on the settings page, with nothing calling back, so your server needs no public address,
  and the session does not expire, so it is a one-time setup. It is stored as a secret and never shown back.
  This is the one source that needs your own TMDB API key, because a TMDB session belongs to the application
  whose key created it and the key the plugin falls back to is Jellyfin's own, shared by every install. Two
  lists were being read short and now read to the end: a Trakt list stopped at its first 100 items, and an
  MDBList list stopped at 1000. An acquisition URL that carries a username and password is redacted before it
  reaches the log, and every other configured secret travels in a header that is never logged. Spelling is US
  English throughout.
