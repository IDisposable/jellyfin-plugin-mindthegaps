changelog: >
  10.11.8.4 (beta) - In the Web UI, the want-to-watch bookmark is now larger and sits in the upper right
  corner of a card's image, and the detail dialog has the same bookmark on its poster. A card's year is
  always shown, a long role, such as an actor's character, is cut with an ellipsis instead of pushing the
  year and bookmark out of view, and a long title or role shows in full when you hover it. An author's own
  page now lists the books by them that you do not have, as a book page already did, below the books you own.
