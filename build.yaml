changelog: >
  10.11.6.0 - The lists you already keep elsewhere now feed the report, and anything you have since filled in
  clears off it. Switch on any of the personal lists in the settings and each arrives as its own group on
  Discover: your IMDb watchlist or any public IMDb list, your Trakt watchlist, your JustWatch watchlist, your
  MDBList watchlist, your Discogs wantlist, your OpenLibrary "Want to Read", your favorite series on TheTVDB,
  and your TMDB watchlist and favorites once you connect your TMDB account, which is two clicks with nothing
  calling back, so your server needs no public address. An IMDb list of people is read as a filmography to
  fill in instead, which is what lets you follow a director or an actor you own nothing by yet. Discover
  groups all of it under proper headings, the lists you keep first, then the lists you pointed the plugin at,
  then what your own library suggested; a list that was read and holds nothing you are missing says so rather
  than not appearing at all, and one that could not be read says that instead. Anything you have acquired can
  be cleared without a rescan: a refresh control on every row and every heading checks your library right now
  and drops what you hold, "Clear what I have" does the whole filtered tab at once, and an acquired title
  leaves every tab it appeared on, so one film clears out of its collection, the studio set that wanted it,
  its director's filmography, and any list that suggested it. Whatever survives that can be re-checked against
  its providers in the background, which also picks up what has been added to a collection, discography, or
  bibliography since the last scan. The TODO list checks the same way, and both Markdown exports check before
  writing, so an exported list is what you still need rather than what the last scan believed. Titles with no
  release date at all are treated as not yet out, badged Announced and hidden under "Hide upcoming", with
  music and books exempt because a sparse entry for an old release often carries no date. Diagnose no longer
  reports a mix-up over an announced title that shares its name with something you own: the one on your shelf
  is an earlier, different release and nothing needs fixing. Scanning and clearing also read far less of your
  library than they did, so a long scan no longer holds it in memory while it waits on the providers. A Trakt
  list stopped at its first 100 items and an MDBList list at 1000; both now read to the end. An acquisition
  URL carrying a username and password is redacted before it reaches the log, and every other configured
  secret travels in a header that is never logged.
